<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - 闲鱼卡片</title>
    <meta name="description" content="{{.Description}}">
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:description" content="{{.Description}}">
    <meta property="og:image" content="{{.ImageURL}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{.ShortLinkURL}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{.Title}}">
    <meta name="twitter:description" content="{{.Description}}">
    <meta name="twitter:image" content="{{.ImageURL}}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        
        .card-header {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            padding: 20px;
            text-align: center;
            color: white;
        }
        
        .card-logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .card-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        
        .card-content {
            padding: 25px;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .card-description {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .card-tag {
            background: #f0f0f0;
            color: #666;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .card-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: #FF6B35;
            display: block;
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        
        .card-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 1px solid #e9ecef;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-1px);
        }
        
        .floating-action {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .floating-action:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF6B35;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .card-container {
                max-width: 100%;
                margin: 10px;
            }
            
            .card-image {
                height: 200px;
            }
            
            .floating-action {
                bottom: 20px;
                right: 20px;
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card-header">
            <div class="card-logo">🐟 闲鱼</div>
            <div class="card-subtitle">发现好物，分享生活</div>
        </div>
        
        {{if .ImageURL}}
        <img src="{{.ImageURL}}" alt="{{.Title}}" class="card-image">
        {{end}}
        
        <div class="card-content">
            <h1 class="card-title">{{.Title}}</h1>
            <p class="card-description">{{.Description}}</p>
            
            {{if .Tags}}
            <div class="card-tags">
                {{range $tag := .Tags}}
                <span class="card-tag">{{$tag}}</span>
                {{end}}
            </div>
            {{end}}
            
            <div class="card-stats">
                <div class="stat-item">
                    <span class="stat-number">{{.ViewCount}}</span>
                    <span class="stat-label">浏览</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">{{.LikeCount}}</span>
                    <span class="stat-label">点赞</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">{{.ShareCount}}</span>
                    <span class="stat-label">分享</span>
                </div>
            </div>
            
            <div class="card-actions">
                {{if .RedirectURL}}
                <a href="{{.RedirectURL}}" class="btn btn-primary" onclick="handleClick()">
                    立即查看
                </a>
                {{end}}
                <button class="btn btn-secondary" onclick="handleShare()">
                    分享卡片
                </button>
            </div>
        </div>
    </div>
    
    <div class="floating-action" onclick="handleBack()">
        ←
    </div>
    
    <script>
        // 卡片埋点凭证：渲染时由服务端按卡片 ID + 过期时间签发的 HMAC，
        // 三条上报口都必须带上它，服务端会校验凭证与 URL 里的 ID 是否绑定。
        const XIANYU_CARD_TOKEN = '{{.ReportToken}}';

        // 处理点击事件
        function handleClick() {
            // 记录点击统计
            fetch('/api/xianyu/{{.ID}}/click', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Xianyu-Card-Token': XIANYU_CARD_TOKEN,
                },
                body: JSON.stringify({
                    ip: '{{.ClientIP}}',
                    user_agent: navigator.userAgent,
                    referer: document.referrer
                })
            }).catch(console.error);
        }
        
        // 处理分享事件
        function handleShare() {
            // 记录分享统计
            fetch('/api/xianyu/{{.ID}}/share', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Xianyu-Card-Token': XIANYU_CARD_TOKEN,
                },
                body: JSON.stringify({
                    ip: '{{.ClientIP}}',
                    user_agent: navigator.userAgent,
                    referer: document.referrer
                })
            }).catch(console.error);
            
            // 尝试原生分享
            if (navigator.share) {
                navigator.share({
                    title: '{{.Title}}',
                    text: '{{.Description}}',
                    url: window.location.href
                }).catch(console.error);
            } else {
                // 复制链接到剪贴板
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('链接已复制到剪贴板');
                }).catch(() => {
                    alert('复制失败，请手动复制链接');
                });
            }
        }
        
        // 处理返回事件
        function handleBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.close();
            }
        }
        
        // 页面加载完成后记录浏览统计
        window.addEventListener('load', function() {
            fetch('/api/xianyu/{{.ID}}/view', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Xianyu-Card-Token': XIANYU_CARD_TOKEN,
                },
                body: JSON.stringify({
                    ip: '{{.ClientIP}}',
                    user_agent: navigator.userAgent,
                    referer: document.referrer
                })
            }).catch(console.error);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="{{.ThemeColor}}">
    <title>{{.Title}} - {{.PlatformLabel}}客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            line-height: 1.5;
        }
        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* 顶部品牌栏 */
        .brand-bar {
            background: {{.ThemeColor}};
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }
        .brand-bar .platform-name {
            flex: 1;
        }
        .brand-bar .badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 400;
        }
        /* 卡片内容区 */
        .card-wrapper {
            padding: 20px 16px 24px;
            flex: 1;
        }
        .card-cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f0f0;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c0c0c0;
            font-size: 14px;
            background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
        }
        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 10px;
            line-height: 1.35;
            word-break: break-word;
        }
        .card-desc {
            font-size: 14px;
            color: #6e6e73;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .card-tags {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .card-tag {
            background: {{.ThemeColor}}1a;
            color: {{.ThemeColor}};
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        /* 信息栏 */
        .info-bar {
            margin-top: 20px;
            padding: 12px 14px;
            background: #f5f5f7;
            border-radius: 10px;
            font-size: 12px;
            color: #6e6e73;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-bar .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34c759;
            flex-shrink: 0;
        }
        /* 底部联系客服按钮 */
        .action-bar {
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            background: #fff;
            border-top: 1px solid #f0f0f0;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        .chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 16px;
            background: {{.ThemeColor}};
            color: #fff;
            text-decoration: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px {{.ThemeColor}}40;
        }
        .chat-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .chat-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .chat-btn-sub {
            text-align: center;
            font-size: 11px;
            color: #aeaeb2;
            margin-top: 8px;
        }
        /* 错误兜底 */
        .error-page {
            text-align: center;
            padding: 60px 20px;
            color: #6e6e73;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="brand-bar">
            <span class="platform-name">{{.PlatformLabel}} · 官方客服</span>
            <span class="badge">已认证</span>
        </div>

        <div class="card-wrapper">
            {{if .ImageURL}}
            <div class="card-cover">
                <img src="{{.ImageURL}}" alt="{{.Title}}" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=\'card-cover-placeholder\'>图片加载失败</div>'">
            </div>
            {{end}}

            <h1 class="card-title">{{.Title}}</h1>
            {{if .Description}}
            <div class="card-desc">{{.Description}}</div>
            {{end}}

            {{if .Tags}}
            <div class="card-tags">
                {{range .TagList}}
                <span class="card-tag">{{.}}</span>
                {{end}}
            </div>
            {{end}}

            <div class="info-bar">
                <span class="dot"></span>
                <span>客服在线 · 平均响应 30 秒</span>
            </div>
        </div>

        <div class="action-bar">
            <a class="chat-btn" href="{{.ChatURL}}" id="card-cta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                <span>联系在线客服</span>
            </a>
            <div class="chat-btn-sub">点击立即与客服对话</div>
        </div>
    </div>

    {{if .ReportToken}}
    <script>
        // 埋点上报（闲鱼相位，N-1 方案 A）：凭证由服务端渲染时按卡片 ID 签发，
        // 三条上报口会校验凭证与 URL 里的 ID 绑定（见 reach/card/token.go）。
        // 本页只有两个自然事件：打开=view、点 CTA=click；没有分享按钮，
        // share 不在这里造假上报。fetch 用 keepalive：CTA 是 <a href> 跳转，
        // 不 keepalive 的请求会在跳转瞬间被浏览器取消。
        (function () {
            var TOKEN = '{{.ReportToken}}';
            var CARD_ID = {{.CardID}};
            function report(kind) {
                try {
                    fetch('/api/xianyu/' + CARD_ID + '/' + kind, {
                        method: 'POST',
                        keepalive: true,
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Xianyu-Card-Token': TOKEN
                        },
                        body: JSON.stringify({
                            ip: '',
                            user_agent: navigator.userAgent,
                            referer: document.referrer
                        })
                    }).catch(function () {});
                } catch (e) { /* 埋点失败不影响页面 */ }
            }
            report('view');
            var cta = document.getElementById('card-cta');
            if (cta) {
                cta.addEventListener('click', function () { report('click'); });
            }
        })();
    </script>
    {{end}}
</body>
</html>
